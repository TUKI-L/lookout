# Rebuilds the camera list every day and publishes ./public to GitHub Pages.
name: Build & deploy Lookout

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'   # daily, 06:17 UTC: rebuild the camera list
    - cron: '47 5 * * 1'   # Mondays: also crawl webcam channels for new YouTube live streams
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Weekly: find new live streams on the webcam channels we know about. Only ever adds to youtube.json.
      - name: Find new YouTube live cams
        if: github.event.schedule == '47 5 * * 1'
        continue-on-error: true
        run: node scripts/snowball-youtube.mjs
      - name: Build camera list
        continue-on-error: true   # if every API is down, ship the committed list instead of failing
        env:
          WINDY_API_KEY: ${{ secrets.WINDY_API_KEY }}
        run: node scripts/build-cameras.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
