# Tests camera endpoints from GitHub's US network (many state DOTs block other networks).
# Prints status, size, CORS header and the first bytes of each response. Changes nothing.
#   gh workflow run probe.yml -f urls="name1=https://… name2=https://…" -f bytes=1500
name: Probe camera endpoints (US network)

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Space-separated name=url pairs'
        required: true
      bytes:
        description: 'How many bytes of each body to print'
        default: '600'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        env:
          URLS: ${{ inputs.urls }}
          BYTES: ${{ inputs.bytes }}
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          for pair in $URLS; do
            name="${pair%%=*}"; url="${pair#*=}"
            out=$(curl -sS -L -m 25 --compressed -A "$UA" -H "Origin: https://lookout.example" -D /tmp/h -o /tmp/b -w "%{http_code} %{size_download}" "$url" 2>&1 | tail -1)
            cors=$(grep -i '^access-control-allow-origin' /tmp/h | tail -1 | tr -d '\r')
            echo "### $name | $out | ${cors:-no-cors}"
            head -c "$BYTES" /tmp/b | tr '\n\r' '  '; echo; echo
          done
